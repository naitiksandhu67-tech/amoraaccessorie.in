<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Jewels | Jewellery & Accessories</title>
<meta name="description" content="Cute, curated jewellery and accessories. Shipping across India. Order easily and get confirmation on WhatsApp.">
<meta property="og:title" content="Sample Jewels | Jewellery & Accessories">
<meta property="og:description" content="Cute, curated jewellery & accessories, shipping across India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3340;--muted:#9a7f8c;--pink:#ff8fb1;--pink2:#ee5f93;--lav:#cdbdff;--peach:#ffd9c9;--cream:#fff7f9;--line:#f6d9e4;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Quicksand',sans-serif;color:var(--ink);line-height:1.5;background:var(--cream);position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
 background:
  radial-gradient(circle at 8% 8%,#ffd6e6 0,transparent 38%),
  radial-gradient(circle at 92% 18%,#e3d8ff 0,transparent 38%),
  radial-gradient(circle at 20% 88%,#ffe5d4 0,transparent 40%),
  radial-gradient(circle at 85% 92%,#ffd6e6 0,transparent 35%),
  var(--cream)}
h1,h2,h3{font-family:'Pacifico',cursive;font-weight:400}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* announcement + header */
.ann{background:linear-gradient(90deg,var(--pink),var(--lav));color:#fff;text-align:center;font-size:.85rem;font-weight:600;padding:7px 10px;letter-spacing:.3px}
header{position:sticky;top:0;z-index:40;background:rgba(255,247,249,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Pacifico',cursive;font-size:1.45rem;color:var(--pink2)}
.cartbtn{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border:0;border-radius:50px;padding:9px 18px;font-size:.92rem;font-weight:700;box-shadow:0 6px 14px rgba(238,95,147,.3)}
.cartbtn span{background:#fff;color:var(--pink2);border-radius:50px;padding:1px 8px;margin-left:6px;font-weight:700;font-size:.8rem}

/* hero */
.hero{position:relative;overflow:hidden;margin:18px auto 8px;max-width:1068px;border-radius:34px;text-align:center;padding:52px 18px 46px;
 background:linear-gradient(135deg,#ffd0e2 0%,#e4d8ff 55%,#ffe4d3 100%);box-shadow:0 18px 40px rgba(238,95,147,.18)}
.hero h1{font-size:clamp(2.1rem,8vw,3.6rem);color:#fff;text-shadow:0 3px 0 rgba(238,95,147,.45);margin-bottom:8px}
.hero p{color:#7a566a;font-weight:600;margin-bottom:22px}
.hero .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.fl{position:absolute;font-size:1.6rem;animation:fl 5s ease-in-out infinite;opacity:.9}
.fl:nth-child(1){top:12%;left:7%}
.fl:nth-child(2){top:20%;right:9%;animation-delay:1s;font-size:2rem}
.fl:nth-child(3){bottom:14%;left:12%;animation-delay:2s}
.fl:nth-child(4){bottom:18%;right:8%;animation-delay:.5s}
.fl:nth-child(5){top:55%;left:3%;animation-delay:1.5s;font-size:1.2rem}
.fl:nth-child(6){top:8%;left:48%;animation-delay:2.5s;font-size:1.2rem}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}

.btn{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border:0;border-radius:50px;padding:11px 24px;font-size:.95rem;font-weight:700;transition:.2s;display:inline-block;text-align:center;box-shadow:0 6px 14px rgba(238,95,147,.28)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 18px rgba(238,95,147,.34)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.out{background:#fff;color:var(--pink2);border:2px solid var(--pink);box-shadow:none}
.btn.full{width:100%}

h2.sec{text-align:center;font-size:1.9rem;color:var(--pink2);margin:34px 0 4px}
.sub{text-align:center;color:var(--muted);margin-bottom:16px;font-weight:500}

/* category chips */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:#fff;border:2px solid var(--line);color:var(--muted);border-radius:50px;padding:9px 18px;font-size:.92rem;font-weight:700;transition:.2s}
.tab:hover{border-color:var(--pink)}
.tab.on{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(238,95,147,.3)}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:36px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}}
.card{background:var(--card);border:2px solid #fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:.25s;box-shadow:0 8px 22px rgba(238,95,147,.1);position:relative}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(238,95,147,.2)}
.pic{aspect-ratio:1/1;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.p0{background-color:#ffe1ec}.p1{background-color:#e8deff}.p2{background-color:#ffe8d9}.p3{background-color:#dff3ee}
.badge{position:absolute;top:10px;left:10px;background:#fff;color:var(--pink2);font-weight:700;font-size:.74rem;border-radius:50px;padding:3px 10px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.cb{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:.98rem;font-family:'Quicksand',sans-serif;font-weight:700;color:var(--ink)}
.pr b{color:var(--pink2);font-size:1.05rem}
.pr s{color:var(--muted);font-size:.85rem;margin-left:6px}
.cb .btn{margin-top:auto;width:100%;padding:9px;font-size:.88rem}

/* trust */
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:6px 0 40px}
.tb{background:#fff;border:2px dashed var(--pink);border-radius:22px;padding:18px 14px;text-align:center;font-size:.9rem;font-weight:500;color:var(--muted)}
.tb i{display:block;font-style:normal;font-size:1.8rem;margin-bottom:4px}
.tb b{display:block;margin-bottom:3px;color:var(--pink2);font-size:1rem}

footer{background:linear-gradient(135deg,#ffd0e2,#e4d8ff);color:var(--ink);padding:34px 16px 96px;text-align:center;font-size:.9rem;border-radius:34px 34px 0 0;font-weight:500}
footer .logo{display:block;margin-bottom:8px;font-size:1.6rem}
footer ul{list-style:none;margin:14px auto;max-width:560px}
footer li{margin-bottom:6px}
footer a{color:var(--pink2);font-weight:700}

.wafloat{position:fixed;right:14px;bottom:14px;background:#25D366;color:#06210f;border-radius:50px;padding:12px 18px;font-weight:700;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.22);font-size:.92rem}

/* cart drawer */
.ov{position:fixed;inset:0;background:rgba(74,51,64,.45);display:none;z-index:80}
.ov.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--cream);z-index:90;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;border-radius:26px 0 0 26px}
.drawer.show{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{color:var(--pink2)}
.dh button{background:none;border:0;font-size:1.8rem;color:var(--muted)}
.items{flex:1;overflow:auto;padding:8px 16px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.thumb{width:58px;height:58px;border-radius:14px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:1.5rem}
.it .in{flex:1;font-size:.9rem;font-weight:600}
.qty{display:flex;align-items:center;gap:10px;margin-top:4px}
.qty button{width:26px;height:26px;border-radius:50%;border:2px solid var(--pink);background:#fff;color:var(--pink2);font-weight:700}
.rm{background:none;border:0;font-size:1.4rem;color:var(--muted)}
.df{padding:16px 18px;border-top:1px solid var(--line);background:#fff}
.row{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px;font-weight:500}
.row.t{font-weight:700;font-size:1.1rem;margin:8px 0 12px;color:var(--pink2)}

/* checkout */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(74,51,64,.5)}
.modal.show{display:flex}
.mbox{background:var(--cream);width:min(520px,100%);max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:26px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh h3{color:var(--pink2)}
.mh button{background:none;border:0;font-size:1.8rem;color:var(--muted)}
label{display:block;font-size:.85rem;margin:10px 0 4px;color:var(--muted);font-weight:600}
input,textarea{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:14px;font-family:inherit;font-size:.95rem;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:8px;font-size:.92rem;background:#fff;color:var(--ink)}
.opt input{width:auto}
.upi{display:none;background:#fff0f5;border:2px dashed var(--pink);border-radius:16px;padding:12px;margin-top:10px;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted);margin-top:10px}
.ok{display:none;text-align:center;padding:22px 6px}
.ok h2{margin-bottom:8px;color:var(--pink2)}
</style>
</head>
<body>
